<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 280px; padding: 12px; margin: 0; }
    h3 { margin: 0 0 10px; font-size: 16px; }
    button { width: 100%; padding: 9px; margin: 4px 0; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }
    .btn-provider { background: #f8fafc; font-weight: 500; border-color: #cbd5e1; }
    .btn-provider:hover { background: #f1f5f9; }
    .btn-settings { background: #fff; margin-top: 8px; border-style: dashed; }
    .btn-settings:hover { background: #f8fafc; }
    small { color: #64748b; display: block; margin: 1px 0 8px 2px; font-size: 11px; }
    #status { margin-top: 10px; font-size: 12px; line-height: 1.4; color: #334155; }
    .empty-notice { font-size: 12px; color: #64748b; padding: 8px 0; }
  </style>
</head>
<body>
  <h3>Cover Letter Handoff</h3>

  <div id="provider-buttons"></div>

  <button id="settings" class="btn-settings">⚙️ Settings & AI Websites</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
