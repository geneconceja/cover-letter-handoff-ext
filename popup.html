<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap');

    :root {
      --bg: #ffffff;
      --fg: #09090b;
      --muted: #71717a;
      --border: #e4e4e7;
      --card-bg: #ffffff;
      --card-fg: #09090b;
      --card-border: #e4e4e7;
      --card-hover-bg: #09090b;
      --card-hover-fg: #ffffff;
      --card-hover-border: #09090b;
      --badge-bg: #f4f4f5;
      --badge-fg: #71717a;
      --badge-hover-bg: #27272a;
      --badge-hover-fg: #e4e4e7;
      --settings-bg: #fafafa;
      --settings-hover: #f4f4f5;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-hover: 0 4px 12px -2px rgba(0, 0, 0, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #27272a;
        --card-bg: #141417;
        --card-fg: #fafafa;
        --card-border: #27272a;
        --card-hover-bg: #ffffff;
        --card-hover-fg: #09090b;
        --card-hover-border: #ffffff;
        --badge-bg: #27272a;
        --badge-fg: #a1a1aa;
        --badge-hover-bg: #e4e4e7;
        --badge-hover-fg: #18181b;
        --settings-bg: #141417;
        --settings-hover: #27272a;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-hover: 0 4px 14px -2px rgba(255, 255, 255, 0.12);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 216px;
      padding: 10px;
      color: var(--fg);
      background: var(--bg);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.2px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--fg);
      border-radius: 50%;
      display: inline-block;
    }

    .version-tag {
      font-size: 9px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.2px;
    }

    .btn-provider {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      margin: 4px 0;
      background: var(--card-bg);
      color: var(--card-fg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.2px;
      transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-sm);
    }

    .btn-provider:hover {
      background: var(--card-hover-bg);
      color: var(--card-hover-fg);
      border-color: var(--card-hover-border);
      transform: translateY(-1px);
      box-shadow: var(--shadow-hover);
    }

    .btn-provider:active {
      transform: translateY(0);
      filter: brightness(0.95);
    }

    .btn-content {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-content svg {
      flex-shrink: 0;
      fill: currentColor;
      transition: transform 0.16s ease;
    }

    .btn-provider:hover .btn-content svg {
      transform: scale(1.08);
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 10px;
      background: var(--badge-bg);
      color: var(--badge-fg);
      border: 1px solid var(--card-border);
      transition: all 0.16s ease;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }

    .btn-provider:hover .badge {
      background: var(--badge-hover-bg);
      color: var(--badge-hover-fg);
      border-color: transparent;
    }

    .btn-settings {
      width: 100%;
      margin-top: 8px;
      padding: 5px 8px;
      background: var(--settings-bg);
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn-settings:hover {
      background: var(--settings-hover);
      color: var(--fg);
      border-style: solid;
      border-color: var(--fg);
    }

    #status {
      margin-top: 6px;
      font-size: 10.5px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--muted);
      text-align: center;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <span class="dot"></span>
      <span>Cover Letter</span>
    </div>
    <span class="version-tag">HANDOFF</span>
  </div>

  <button class="btn-provider" id="claude">
    <span class="btn-content">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2C12.5 7.5 16.5 11.5 22 12C16.5 12.5 12.5 16.5 12 22C11.5 16.5 7.5 12.5 2 12C7.5 11.5 11.5 7.5 12 2Z"/></svg>
      <span>Claude</span>
    </span>
    <span class="badge" id="count-claude">0</span>
  </button>

  <button class="btn-provider" id="chatgpt">

      <span>ChatGPT</span>
    </span>
    <span class="badge" id="count-chatgpt">0</span>
  </button>

  <button class="btn-provider" id="gemini">
    <span class="btn-content">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 24C12 17.37 6.63 12 0 12C6.63 12 12 6.63 12 0C12 6.63 17.37 12 24 12C17.37 12 12 17.37 12 24Z"/></svg>
      <span>Gemini</span>
    </span>
    <span class="badge" id="count-gemini">0</span>
  </button>

  <button class="btn-provider" id="deepseek">
    <span class="btn-content">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 7.2 2 12.3c0 2.8 1.4 5.3 3.6 7 1.8 1.4 4.1 2.2 6.4 2.2 5.5 0 10-4.2 10-9.3 0-.6-.1-1.3-.2-1.9l1.8-1.5c.4-.3.4-.9.1-1.3s-.9-.4-1.3-.1l-1.9 1.5C18.8 5.6 15.6 3 12 3zm-4 8c-.8 0-1.5-.7-1.5-1.5S7.2 8 8 8s1.5.7 1.5 1.5S8.8 11 8 11zm9.5 3.5c-1.8 1.8-4.3 2.7-6.8 2.5-1.1-.1-2.1-.5-3-1.1-.4-.3-.5-.9-.2-1.3.3-.4.9-.5 1.3-.2.7.5 1.5.8 2.3.9 2 .2 4-.5 5.5-1.9.4-.4 1-.3 1.4.1.3.4.3 1-.1 1.4z"/></svg>
      <span>DeepSeek</span>
    </span>
    <span class="badge" id="count-deepseek">0</span>
  </button>

  <button class="btn-provider" id="perplexity">
    <span class="btn-content">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2a1 1 0 0 1 1 1v4.34l3.07-3.07a1 1 0 0 1 1.41 1.41L14.41 8.75l4.34-1.16a1 1 0 1 1 .52 1.93l-4.7 1.26 3.68 3.68a1 1 0 1 1-1.41 1.41L13.16 12.2l1.16 4.34a1 1 0 1 1-1.93.52l-1.26-4.7-3.68 3.68a1 1 0 0 1-1.41-1.41L8.75 11.5l-4.34 1.16a1 1 0 1 1-.52-1.93l4.7-1.26L4.91 5.79a1 1 0 0 1 1.41-1.41L9.4 7.45 8.24 3.11A1 1 0 0 1 9.21 2h2.79z"/></svg>
      <span>Perplexity</span>
    </span>
    <span class="badge" id="count-perplexity">0</span>
  </button>

  <button id="settings" class="btn-settings">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    <span>Settings</span>
  </button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
