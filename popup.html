<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 216px;
      padding: 11px;
      color: #09090b;
      background: #ffffff;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.2px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      padding-bottom: 6px;
      border-bottom: 1px solid #f1f5f9;
    }

    .header-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #09090b;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #09090b;
      border-radius: 50%;
      display: inline-block;
    }

    .version-tag {
      font-size: 9px;
      font-weight: 700;
      color: #71717a;
      letter-spacing: 0.3px;
    }

    .btn-provider {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      margin: 4px 0;
      background: #ffffff;
      color: #09090b;
      border: 1px solid #e4e4e7;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.2px;
      transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .btn-provider:hover {
      background: #f8fafc;
      border-color: #09090b;
      color: #09090b;
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
    }

    .btn-provider:active {
      transform: translateY(0);
      background: #f1f5f9;
    }

    .btn-content {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-content svg {
      flex-shrink: 0;
      fill: currentColor;
      transition: transform 0.16s ease;
    }

    .btn-provider:hover .btn-content svg {
      transform: scale(1.08);
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 10px;
      background: #f4f4f5;
      color: #71717a;
      border: 1px solid #e4e4e7;
      transition: all 0.16s ease;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }

    .btn-provider:hover .badge {
      background: #ffffff;
      color: #09090b;
      border-color: #cbd5e1;
    }

    .btn-settings {
      width: 100%;
      margin-top: 8px;
      padding: 5px 8px;
      background: #ffffff;
      color: #71717a;
      border: 1px dashed #d4d4d8;
      border-radius: 6px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn-settings:hover {
      background: #f8fafc;
      color: #09090b;
      border-style: solid;
      border-color: #09090b;
    }

    #status {
      margin-top: 6px;
      font-size: 10.5px;
      font-weight: 500;
      line-height: 1.35;
      color: #71717a;
      text-align: center;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <span class="dot"></span>
      <span>Cover Letter</span>
    </div>
    <span class="version-tag">HANDOFF</span>
  </div>

  <!-- Claude (Anthropic 8-ray asterisk) -->
  <button class="btn-provider" id="claude">
    <span class="btn-content">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2a1.75 1.75 0 0 1 1.75 1.75v3.12l2.2-2.2a1.75 1.75 0 1 1 2.48 2.47l-2.2 2.2h3.14a1.75 1.75 0 1 1 0 3.5h-3.13l2.2 2.2a1.75 1.75 0 1 1-2.48 2.48l-2.2-2.2v3.13a1.75 1.75 0 1 1-3.5 0v-3.13l-2.2 2.2a1.75 1.75 0 1 1-2.48-2.48l2.2-2.2H4.13a1.75 1.75 0 1 1 0-3.5h3.13l-2.2-2.2a1.75 1.75 0 1 1 2.48-2.48l2.2 2.2V3.75A1.75 1.75 0 0 1 12 2z"/></svg>
      <span>Claude</span>
    </span>
    <span class="badge" id="count-claude">0</span>
  </button>

  <!-- ChatGPT (OpenAI spiral knot) -->
  <button class="btn-provider" id="chatgpt">
    <span class="btn-content">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M22.28 9.82a5.98 5.98 0 0 0-.52-4.91 6.05 6.05 0 0 0-6.51-2.9A6.06 6.06 0 0 0 4.98 4.18a5.98 5.98 0 0 0-4 2.9 6.05 6.05 0 0 0 .74 7.1 5.98 5.98 0 0 0 .51 4.91 6.05 6.05 0 0 0 6.52 2.9A5.98 5.98 0 0 0 13.26 24a6.06 6.06 0 0 0 5.77-4.21 5.99 5.99 0 0 0 4-2.9 6.06 6.06 0 0 0-.75-7.07zm-9.02 12.61a4.48 4.48 0 0 1-2.88-1.04l.14-.08 4.78-2.76a.8.8 0 0 0 .4-.68v-6.74l2.02 1.17a.07.07 0 0 1 .04.05v5.58a4.5 4.5 0 0 1-4.5 4.5zm-9.66-4.13a4.47 4.47 0 0 1-.54-3.01l.15.08 4.78 2.76a.77.77 0 0 0 .78 0l5.84-3.37v2.33a.08.08 0 0 1-.03.06L9.74 19.95a4.5 4.5 0 0 1-6.14-1.65zM2.34 7.9a4.49 4.49 0 0 1 2.37-1.98v5.68a.77.77 0 0 0 .38.68l5.82 3.35-2.02 1.17a.08.08 0 0 1-.07 0l-4.83-2.79A4.5 4.5 0 0 1 2.34 7.9zm16.1 3.85L12.6 8.38l2.02-1.16a.08.08 0 0 1 .07 0l4.83 2.79a4.5 4.5 0 0 1-.68 8.1v-5.67a.79.79 0 0 0-.4-.69zm2.01-3.02l-.14-.08-4.77-2.79a.78.78 0 0 0-.79 0L9.01 9.23V6.9a.07.07 0 0 1 .03-.06l4.83-2.79a4.5 4.5 0 0 1 6.68 4.66zM8.31 12.86l-2.02-1.16a.08.08 0 0 1-.04-.06V6.07a4.5 4.5 0 0 1 7.38-3.45l-.15.08L8.7 5.46a.8.8 0 0 0-.39.68v6.72zm1.14-2.07l2.55-1.47 2.55 1.47v2.94l-2.55 1.46-2.55-1.46z"/></svg>
      <span>ChatGPT</span>
    </span>
    <span class="badge" id="count-chatgpt">0</span>
  </button>

  <!-- Gemini (Google 4-point curved diamond spark) -->
  <button class="btn-provider" id="gemini">
    <span class="btn-content">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.627 12 12 0-6.627 5.627-12 12-12-6.627 0-12-5.373-12-12z"/></svg>
      <span>Gemini</span>
    </span>
    <span class="badge" id="count-gemini">0</span>
  </button>

  <!-- DeepSeek (Whale silhouette) -->
  <button class="btn-provider" id="deepseek">
    <span class="btn-content">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 7.2 2 12.3c0 2.8 1.4 5.3 3.6 7 1.8 1.4 4.1 2.2 6.4 2.2 5.5 0 10-4.2 10-9.3 0-.6-.1-1.3-.2-1.9l1.8-1.5c.4-.3.4-.9.1-1.3s-.9-.4-1.3-.1l-1.9 1.5C18.8 5.6 15.6 3 12 3zm-4 8c-.8 0-1.5-.7-1.5-1.5S7.2 8 8 8s1.5.7 1.5 1.5S8.8 11 8 11zm9.5 3.5c-1.8 1.8-4.3 2.7-6.8 2.5-1.1-.1-2.1-.5-3-1.1-.4-.3-.5-.9-.2-1.3.3-.4.9-.5 1.3-.2.7.5 1.5.8 2.3.9 2 .2 4-.5 5.5-1.9.4-.4 1-.3 1.4.1.3.4.3 1-.1 1.4z"/></svg>
      <span>DeepSeek</span>
    </span>
    <span class="badge" id="count-deepseek">0</span>
  </button>

  <!-- Perplexity (Infinity-asterisk loop) -->
  <button class="btn-provider" id="perplexity">
    <span class="btn-content">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M20.5 7.2a4.8 4.8 0 0 0-4-2.1c-1.6 0-3 .8-4.5 2.1C10.5 5.9 9.1 5.1 7.5 5.1a4.8 4.8 0 0 0-4 2.1 5.4 5.4 0 0 0-.9 3.2 5.5 5.5 0 0 0 1.2 3.4 5.3 5.3 0 0 0 3.7 2c1.6 0 3-.8 4.5-2.1 1.5 1.3 2.9 2.1 4.5 2.1a5.3 5.3 0 0 0 3.7-2 5.5 5.5 0 0 0 1.2-3.4 5.4 5.4 0 0 0-.9-3.2zm-13 6.4a3.3 3.3 0 0 1-2.3-1.2 3.5 3.5 0 0 1-.8-2.2c0-.8.3-1.6.8-2.2a3.3 3.3 0 0 1 2.3-1.2c1.2 0 2.2.8 3.5 2.2-1.3 1.4-2.3 2.2-3.5 2.2zm9 0c-1.2 0-2.2-.8-3.5-2.2 1.3-1.4 2.3-2.2 3.5-2.2a3.3 3.3 0 0 1 2.3 1.2 3.5 3.5 0 0 1 .8 2.2c0 .8-.3 1.6-.8 2.2a3.3 3.3 0 0 1-2.3 1.2z"/></svg>
      <span>Perplexity</span>
    </span>
    <span class="badge" id="count-perplexity">0</span>
  </button>

  <button id="settings" class="btn-settings">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    <span>Settings</span>
  </button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
