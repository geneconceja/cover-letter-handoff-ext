<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cover Letter Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 24px auto; padding: 0 16px; color: #222; }
    h2 { margin-top: 0; font-size: 20px; }
    textarea { width: 100%; height: 280px; box-sizing: border-box; padding: 10px; font-family: monospace; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
    label { display: block; margin-top: 14px; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    select { padding: 6px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 18px; padding: 8px 20px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-weight: 600; font-size: 14px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #msg { margin-left: 10px; font-size: 13px; color: #16a34a; font-weight: 500; }
  </style>
</head>
<body>
  <h2>Cover Letter Settings</h2>

  <label for="resume">Your resume (plain text)</label>
  <textarea id="resume" placeholder="Paste your full plain text resume here..."></textarea>

  <label for="tone">Tone</label>
  <select id="tone">
    <option value="friendly">Friendly</option>
    <option value="formal">Formal</option>
    <option value="concise">Concise</option>
  </select>

  <br>
  <button id="save">Save Settings</button>
  <span id="msg"></span>

  <script src="options.js"></script>
</body>
</html>
