<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cover Letter Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 24px auto; padding: 0 16px; color: #222; }
    textarea { width: 100%; height: 260px; box-sizing: border-box; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    select, input[type="text"] { padding: 6px 10px; font-size: 14px; }
    button { padding: 8px 16px; cursor: pointer; }
    .section-title { margin-top: 28px; border-top: 1px solid #e0e0e0; padding-top: 20px; }
    .provider-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 8px; }
    .provider-info { display: flex; flex-direction: column; overflow: hidden; }
    .provider-name { font-weight: 600; font-size: 14px; }
    .provider-url { font-size: 12px; color: #666; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; max-width: 450px; }
    .btn-remove { padding: 4px 8px; font-size: 12px; background: #fff0f0; color: #c00; border: 1px solid #fcc; border-radius: 3px; cursor: pointer; }
    .btn-remove:hover { background: #ffe0e0; }
    .add-form { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .add-form input { flex: 1; min-width: 180px; box-sizing: border-box; }
    .err-msg { color: #c00; font-size: 13px; margin-top: 6px; }
    .footer-actions { margin-top: 20px; display: flex; align-items: center; gap: 12px; }
  </style>
</head>
<body>
  <h2>Cover Letter Settings</h2>

  <label for="resume">Your resume (plain text)</label>
  <textarea id="resume" placeholder="Paste your full plain text resume here..."></textarea>

  <label for="tone">Tone</label>
  <select id="tone">
    <option value="friendly">Friendly</option>
    <option value="formal">Formal</option>
    <option value="concise">Concise</option>
  </select>

  <h3 class="section-title">AI Websites & Providers</h3>
  <p style="font-size: 13px; color: #555; margin-top: 4px;">Manage the AI chat websites available in your extension popup.</p>
  
  <div id="provider-list"></div>

  <div class="add-form">
    <input type="text" id="new-name" placeholder="Name (e.g., Perplexity)">
    <input type="text" id="new-url" placeholder="URL (e.g., https://www.perplexity.ai/)">
    <button id="add-provider" type="button">+ Add AI Website</button>
  </div>
  <div id="provider-err" class="err-msg"></div>

  <div class="footer-actions">
    <button id="save" style="background:#2563eb; color:#fff; border:none; border-radius:4px; font-weight:600;">Save Settings</button>
    <button id="reset-providers" type="button" style="background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; border-radius:4px; font-size:12px;">Reset Default AI List</button>
    <span id="msg"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
