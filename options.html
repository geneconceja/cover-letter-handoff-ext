<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cover Letter Settings</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap');

    :root {
      --bg: #ffffff;
      --fg: #09090b;
      --muted: #71717a;
      --border: #e4e4e7;
      --card-bg: #fafafa;
      --input-bg: #ffffff;
      --btn-bg: #09090b;
      --btn-fg: #ffffff;
      --btn-hover-bg: #27272a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #27272a;
        --card-bg: #141417;
        --input-bg: #101012;
        --btn-bg: #ffffff;
        --btn-fg: #09090b;
        --btn-hover-bg: #e4e4e7;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 620px;
      margin: 36px auto;
      padding: 0 20px;
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.2px;
    }

    h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
      color: var(--fg);
    }

    textarea {
      width: 100%;
      height: 280px;
      box-sizing: border-box;
      padding: 12px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      color: var(--fg);
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      resize: vertical;
      transition: border-color 0.15s ease;
    }

    textarea:focus, select:focus {
      outline: none;
      border-color: var(--fg);
    }

    select {
      padding: 8px 12px;
      font-family: inherit;
      font-size: 13px;
      color: var(--fg);
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }

    .actions {
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button#save {
      padding: 9px 20px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      border: 1px solid var(--btn-bg);
      border-radius: 6px;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: -0.2px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button#save:hover {
      background: var(--btn-hover-bg);
      border-color: var(--btn-hover-bg);
    }

    #msg {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <h2>Cover Letter Settings</h2>

  <label for="resume">Your resume (plain text)</label>
  <textarea id="resume" placeholder="Paste your full plain text resume here..."></textarea>

  <label for="tone">Tone</label>
  <select id="tone">
    <option value="friendly">Friendly</option>
    <option value="formal">Formal</option>
    <option value="concise">Concise</option>
  </select>

  <div class="actions">
    <button id="save">Save Settings</button>
    <span id="msg"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
